<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="See you in the code city">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset=".5" stop-color="#6a0f6e"/>
      <stop offset=".85" stop-color="#d4145a"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset=".6" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".18"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="220"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="100" cy="30" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="60" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="25" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="35" r="1.4"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="65" r="1"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="28" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sun -->
    <circle cx="600" cy="150" r="72" fill="url(#sun)">
      <animate attributeName="cy" values="150;144;150" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- text -->
    <text x="600" y="92" text-anchor="middle" font-family="Impact,'Arial Black',Arial,sans-serif" font-size="34" letter-spacing="8" fill="#fff" filter="url(#glow)">SEE YOU IN THE CODE CITY
      <animate attributeName="opacity" values="1;1;.7;1;1" keyTimes="0;.6;.64;.68;1" dur="3.5s" repeatCount="indefinite"/>
    </text>

    <!-- waves -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-600,0" dur="14s" repeatCount="indefinite"/>
      <path d="M0,150 q150,-34 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V220 H0Z" fill="#3b0a6e" opacity=".85"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-600,0;0,0" dur="10s" repeatCount="indefinite"/>
      <path d="M0,172 q150,-28 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V220 H0Z" fill="#7a1fa2" opacity=".9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-600,0" dur="7s" repeatCount="indefinite"/>
      <path d="M0,192 q150,-22 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V220 H0Z" fill="#ff2e93" opacity=".95"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-600,0;0,0" dur="5s" repeatCount="indefinite"/>
      <path d="M0,206 q150,-14 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V220 H0Z" fill="#05000f"/>
    </g>

    <rect width="1200" height="220" fill="url(#scan)"/>
  </g>
</svg>
