<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Player profile: Muhammad Haroon">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset=".6" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffe45c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".18"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="996" height="336" rx="18" fill="#14052b" stroke="url(#border)" stroke-width="2.5"/>
  <rect x="2" y="2" width="996" height="44" rx="18" fill="#2a0a4a"/>
  <rect x="2" y="30" width="996" height="16" fill="#2a0a4a"/>

  <g font-family="'Courier New',monospace" font-weight="bold">
    <text x="30" y="31" font-size="18" letter-spacing="4" fill="#ff2e93" filter="url(#glow)">PLAYER PROFILE</text>
    <circle cx="900" cy="25" r="6" fill="#39ff14">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;7;5" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="915" y="30" font-size="13" fill="#39ff14" letter-spacing="2">ONLINE</text>

    <!-- info column -->
    <g font-size="14" letter-spacing="1">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".5s" begin=".2s" fill="freeze"/>
        <text x="40" y="95" fill="#00e5ff">NAME</text>
        <text x="40" y="117" font-size="19" fill="#ffd6f5">MUHAMMAD HAROON</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".5s" begin=".5s" fill="freeze"/>
        <text x="40" y="153" fill="#00e5ff">CLASS</text>
        <text x="40" y="175" font-size="19" fill="#ffd6f5">FULL-STACK DEVELOPER</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".5s" begin=".8s" fill="freeze"/>
        <text x="40" y="211" fill="#00e5ff">SPECIALTY</text>
        <text x="40" y="233" font-size="16" fill="#ffd6f5">Web engineering · API architecture</text>
        <text x="40" y="254" font-size="16" fill="#ffd6f5">Frontend systems</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".5s" begin="1.1s" fill="freeze"/>
        <text x="40" y="290" fill="#00e5ff">SIDE QUEST</text>
        <text x="40" y="312" font-size="16" fill="#ffd6f5">Open source &amp; modern web tooling</text>
      </g>
    </g>

    <!-- divider -->
    <line x1="500" y1="70" x2="500" y2="318" stroke="#ff2e93" stroke-opacity=".4" stroke-dasharray="4 6"/>

    <!-- skill bars -->
    <g font-size="14" letter-spacing="1" fill="#ffd6f5">
      <text x="535" y="92">TypeScript</text>
      <rect x="690" y="80" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="80" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;221;221;0" keyTimes="0;.3;.9;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="92" fill="#ffe45c">92</text>

      <text x="535" y="130">React</text>
      <rect x="690" y="118" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="118" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;216;216;0" keyTimes="0;.3;.9;1" dur="6s" begin=".15s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="130" fill="#ffe45c">90</text>

      <text x="535" y="168">Node.js</text>
      <rect x="690" y="156" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="156" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;211;211;0" keyTimes="0;.3;.9;1" dur="6s" begin=".3s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="168" fill="#ffe45c">88</text>

      <text x="535" y="206">Next.js</text>
      <rect x="690" y="194" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="194" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;216;216;0" keyTimes="0;.3;.9;1" dur="6s" begin=".45s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="206" fill="#ffe45c">90</text>

      <text x="535" y="244">Tailwind CSS</text>
      <rect x="690" y="232" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="232" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;228;228;0" keyTimes="0;.3;.9;1" dur="6s" begin=".6s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="244" fill="#ffe45c">95</text>

      <text x="535" y="282">Supabase / SQL</text>
      <rect x="690" y="270" width="240" height="14" rx="7" fill="#2a0a4a"/>
      <rect x="690" y="270" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="width" values="0;197;197;0" keyTimes="0;.3;.9;1" dur="6s" begin=".75s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="282" fill="#ffe45c">82</text>
    </g>
  </g>

  <rect x="2" y="2" width="996" height="336" rx="18" fill="url(#scan)"/>
</svg>
