<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Muhammad Haroon - Full-Stack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset=".35" stop-color="#3b0a6e"/>
      <stop offset=".62" stop-color="#d4145a"/>
      <stop offset=".82" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset=".5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/>
      <stop offset=".5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0650"/>
      <stop offset="1" stop-color="#05000f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ff2e93" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff2e93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".2"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gclip"><rect x="0" y="270" width="1200" height="150"/></clipPath>
    <mask id="sunMask">
      <rect width="1200" height="420" fill="#fff"/>
      <g fill="#000">
        <rect x="440" y="214" width="320" height="2"><animate attributeName="height" values="2;4;2" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="440" y="228" width="320" height="4"><animate attributeName="height" values="4;7;4" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="440" y="242" width="320" height="6"><animate attributeName="height" values="6;9;6" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="440" y="256" width="320" height="9"><animate attributeName="height" values="9;12;9" dur="3s" repeatCount="indefinite"/></rect>
      </g>
    </mask>
    <path id="frond" d="M0,0 Q45,-45 105,-8 Q50,-20 0,0Z"/>
    <g id="palm">
      <path d="M0,0 C-6,-60 6,-120 -4,-190" stroke="#05000f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g transform="translate(-4,-190)" fill="#05000f">
        <use href="#frond" xlink:href="#frond" transform="rotate(-40)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(-8)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(25)"/>
        <use href="#frond" xlink:href="#frond" transform="rotate(58)"/>
        <g transform="scale(-1,1)">
          <use href="#frond" xlink:href="#frond" transform="rotate(-40)"/>
          <use href="#frond" xlink:href="#frond" transform="rotate(-8)"/>
          <use href="#frond" xlink:href="#frond" transform="rotate(25)"/>
          <use href="#frond" xlink:href="#frond" transform="rotate(58)"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="270" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="30" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="70" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="25" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="55" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="20" r="1.4"><animate attributeName="opacity" values="1;.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="35" r="1.2"><animate attributeName="opacity" values=".1;1;.1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="70" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="28" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="60" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="22" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="115" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="120" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
    <line x1="0" y1="0" x2="-70" y2="-22"/>
    <animateMotion path="M950,30 L520,150" dur="7s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;.7;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.7;.8;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- birds -->
  <g stroke="#1a0536" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M0,0 q6,-7 12,0 q6,-7 12,0">
      <animateMotion path="M-40,95 L1240,60" dur="22s" repeatCount="indefinite"/>
    </path>
    <path d="M0,0 q5,-6 10,0 q5,-6 10,0">
      <animateMotion path="M-90,120 L1240,90" dur="26s" begin="-9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sun -->
  <circle cx="600" cy="190" r="150" fill="url(#halo)">
    <animate attributeName="r" values="150;178;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="190" r="118" fill="url(#sun)" mask="url(#sunMask)"/>

  <!-- skyline -->
  <g fill="#16042e">
    <rect x="330" y="238" width="26" height="32"/>
    <rect x="360" y="222" width="30" height="48"/>
    <rect x="396" y="244" width="22" height="26"/>
    <rect x="422" y="214" width="34" height="56"/>
    <rect x="462" y="236" width="24" height="34"/>
    <rect x="720" y="232" width="26" height="38"/>
    <rect x="750" y="212" width="32" height="58"/>
    <rect x="788" y="240" width="24" height="30"/>
    <rect x="816" y="226" width="30" height="44"/>
    <rect x="852" y="242" width="22" height="28"/>
  </g>
  <g fill="#ffe45c">
    <rect x="368" y="230" width="3" height="4"><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="428" y="224" width="3" height="4"><animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="440" y="240" width="3" height="4"><animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="758" y="222" width="3" height="4"><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="768" y="238" width="3" height="4"><animate attributeName="opacity" values="1;0;1" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="824" y="236" width="3" height="4"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ground -->
  <rect y="270" width="1200" height="150" fill="url(#ground)"/>
  <g clip-path="url(#gclip)" stroke="#ff2e93" fill="none" filter="url(#softglow)">
    <g stroke-width="1.5" opacity=".85">
      <line x1="600" y1="270" x2="-450" y2="420"/><line x1="600" y1="270" x2="-300" y2="420"/>
      <line x1="600" y1="270" x2="-150" y2="420"/><line x1="600" y1="270" x2="0" y2="420"/>
      <line x1="600" y1="270" x2="150" y2="420"/><line x1="600" y1="270" x2="300" y2="420"/>
      <line x1="600" y1="270" x2="450" y2="420"/><line x1="600" y1="270" x2="600" y2="420"/>
      <line x1="600" y1="270" x2="750" y2="420"/><line x1="600" y1="270" x2="900" y2="420"/>
      <line x1="600" y1="270" x2="1050" y2="420"/><line x1="600" y1="270" x2="1200" y2="420"/>
      <line x1="600" y1="270" x2="1350" y2="420"/><line x1="600" y1="270" x2="1500" y2="420"/>
      <line x1="600" y1="270" x2="1650" y2="420"/>
    </g>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="-.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="-.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
    <line x1="0" x2="1200" y1="270" y2="270" stroke-width="2">
      <animate attributeName="y1" values="270;420" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
      <animate attributeName="y2" values="270;420" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".6 0 1 1"/>
    </line>
  </g>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#00e5ff" stroke-width="2" filter="url(#softglow)">
    <animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- palms (back) -->
  <g transform="translate(260,420) scale(.7)" opacity=".9">
    <g><animateTransform attributeName="transform" type="rotate" values="-1.5;1.5;-1.5" dur="6s" repeatCount="indefinite"/><use href="#palm" xlink:href="#palm"/></g>
  </g>
  <g transform="translate(950,420) scale(.75)" opacity=".9">
    <g><animateTransform attributeName="transform" type="rotate" values="1.5;-1.5;1.5" dur="5.5s" repeatCount="indefinite"/><use href="#palm" xlink:href="#palm"/></g>
  </g>
  <!-- palms (front) -->
  <g transform="translate(110,430) scale(1.15)">
    <g><animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="5s" repeatCount="indefinite"/><use href="#palm" xlink:href="#palm"/></g>
  </g>
  <g transform="translate(1095,430) scale(1.2)">
    <g><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="4.6s" repeatCount="indefinite"/><use href="#palm" xlink:href="#palm"/></g>
  </g>

  <!-- title -->
  <g font-family="Impact,'Arial Black',Arial,sans-serif" font-weight="900" text-anchor="middle">
    <text x="605" y="196" font-size="86" fill="#00e5ff" opacity="0" textLength="860" lengthAdjust="spacingAndGlyphs">MUHAMMAD HAROON
      <animate attributeName="opacity" values="0;0;.85;0;0;.6;0;0" keyTimes="0;.7;.72;.75;.88;.9;.93;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="595" y="196" font-size="86" fill="#ff2e93" opacity="0" textLength="860" lengthAdjust="spacingAndGlyphs">MUHAMMAD HAROON
      <animate attributeName="opacity" values="0;0;.85;0;0;.6;0;0" keyTimes="0;.7;.72;.75;.88;.9;.93;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <g filter="url(#glow)">
      <text x="600" y="196" font-size="86" fill="url(#titleGrad)" stroke="#2a0650" stroke-width="3" paint-order="stroke" textLength="860" lengthAdjust="spacingAndGlyphs">MUHAMMAD HAROON</text>
    </g>
    <text x="600" y="240" font-size="22" letter-spacing="10" fill="#00e5ff" filter="url(#softglow)" font-family="'Courier New',monospace">FULL-STACK DEVELOPER
      <animate attributeName="opacity" values="1;1;.4;1;1;.7;1" keyTimes="0;.5;.52;.55;.8;.82;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tagline on ground -->
  <rect x="330" y="318" width="540" height="34" rx="6" fill="#05000f" opacity=".65"/>
  <text x="600" y="341" text-anchor="middle" font-family="'Courier New',monospace" font-size="17" font-weight="bold" letter-spacing="3" fill="#ffe45c">NEXT.JS · REACT · NODE · TYPESCRIPT</text>

  <!-- HUD: now playing -->
  <g transform="translate(36,28)" font-family="'Courier New',monospace" font-size="13" font-weight="bold">
    <g fill="#00e5ff">
      <rect x="0" y="8" width="5" height="10"><animate attributeName="height" values="6;20;10;18;6" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;10;2;14" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="8" y="8" width="5" height="10"><animate attributeName="height" values="16;6;20;8;16" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="4;14;0;12;4" dur=".7s" repeatCount="indefinite"/></rect>
      <rect x="16" y="8" width="5" height="10"><animate attributeName="height" values="10;20;6;16;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;0;14;4;10" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="24" y="8" width="5" height="10"><animate attributeName="height" values="20;8;18;6;20" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="0;12;2;14;0" dur=".8s" repeatCount="indefinite"/></rect>
    </g>
    <text x="40" y="16" fill="#fff">NOW PLAYING: SHIPPING CODE ALL NIGHT</text>
  </g>

  <!-- overlays -->
  <rect width="1200" height="420" fill="url(#scan)"/>
  <rect width="1200" height="420" fill="url(#vignette)"/>
</svg>
