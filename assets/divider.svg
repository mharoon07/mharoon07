<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="presentation">
  <defs>
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#ff2e93"/>
      <stop offset=".8" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- road -->
  <rect x="0" y="52" width="1200" height="12" fill="#14052b"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#ffe45c" stroke-width="2" stroke-dasharray="24 22">
    <animate attributeName="stroke-dashoffset" values="0;-46" dur=".5s" repeatCount="indefinite"/>
  </line>
  <rect x="0" y="50" width="1200" height="3" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.55;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- car -->
  <g>
    <animateMotion path="M-120,0 L1320,0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(0,50)">
      <!-- headlight beam -->
      <polygon points="64,-8 150,-20 150,2" fill="#ffe45c" opacity=".25">
        <animate attributeName="opacity" values=".15;.35;.15" dur=".6s" repeatCount="indefinite"/>
      </polygon>
      <!-- body -->
      <path d="M0,-4 L0,-12 L14,-14 L24,-24 L48,-24 L58,-14 L66,-12 L66,-4 Z" fill="#ff2e93"/>
      <path d="M27,-22 L46,-22 L53,-14 L22,-14 Z" fill="#14052b"/>
      <rect x="0" y="-8" width="66" height="2" fill="#ffe45c" opacity=".8"/>
      <!-- lights -->
      <rect x="-2" y="-12" width="4" height="4" fill="#ff1744" filter="url(#glow)"/>
      <rect x="63" y="-12" width="4" height="4" fill="#fff9c4" filter="url(#glow)"/>
      <!-- wheels -->
      <circle cx="15" cy="-3" r="6" fill="#05000f" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="51" cy="-3" r="6" fill="#05000f" stroke="#00e5ff" stroke-width="1.5"/>
    </g>
  </g>
</svg>
