<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120" role="img" aria-label="Let's build something legendary">
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" d="M0,-20 L5.9,-8.1 L19,-6.2 L9.5,3.1 L11.8,16.2 L0,10 L-11.8,16.2 L-9.5,3.1 L-19,-6.2 L-5.9,-8.1Z"/>
  </defs>

  <g filter="url(#glow)">
    <use href="#star" transform="translate(240,38)" fill="#ff2e2e">
      <animate attributeName="fill" values="#ff2e2e;#2e6bff;#ff2e2e" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(295,38)" fill="#2e6bff">
      <animate attributeName="fill" values="#2e6bff;#ff2e2e;#2e6bff" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(350,38)" fill="#ff2e2e">
      <animate attributeName="fill" values="#ff2e2e;#2e6bff;#ff2e2e" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(405,38)" fill="#2e6bff">
      <animate attributeName="fill" values="#2e6bff;#ff2e2e;#2e6bff" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#star" transform="translate(460,38)" fill="#ff2e2e">
      <animate attributeName="fill" values="#ff2e2e;#2e6bff;#ff2e2e" dur="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <text x="350" y="92" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" font-weight="bold" letter-spacing="6" fill="#ffe45c" filter="url(#glow)">LET'S BUILD SOMETHING LEGENDARY
    <animate attributeName="opacity" values="1;1;.6;1;1" keyTimes="0;.6;.65;.7;1" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
